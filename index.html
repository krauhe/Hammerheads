<!doctype html>
<!-- Selvstændig 3D-pauseskærm. Åbn denne fil direkte; alle ressourcer er lokale. -->
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#031b35">
  <title>Hammerhajer · Det blå dyb</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="ocean.css">
</head>
<body>
  <main id="ocean" aria-label="3D-pauseskærm med hammerhajer i et dybblåt hav">
    <canvas id="scene" role="img" aria-label="Hammerhajer svømmer langsomt mellem lysstråler og små partikler i havet."></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <header class="chrome title">
      <span class="eyebrow"><span class="live-dot"></span> ET ØJEBLIK UNDER OVERFLADEN</span>
      <h1>Det blå dyb<span>.</span></h1>
      <p>Hammerhajer i det åbne hav</p>
    </header>
    <div id="loading" role="status">På vej under overfladen …</div>
    <div id="error" role="alert" hidden></div>
    <footer class="chrome">
      <div class="caption"><span class="line"></span> Bare lad havet bevæge sig.</div>
      <nav class="controls" aria-label="Pauseskærmens betjening">
        <button id="pause" type="button" title="Mellemrum" aria-label="Sæt animationen på pause" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-icon" d="M9 5v14M15 5v14"/></svg>
          <span id="pause-label">Pause</span>
        </button>
        <label class="speed" title="Svømmehastighed">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h10c5 0 5-6 1-6M3 13h16M3 17h8c5 0 5 5 1 5"/></svg>
          <input id="speed" type="range" min="0.3" max="1.6" step="0.1" value="0.7" aria-label="Svømmehastighed">
        </label>
        <button id="fullscreen" type="button" title="F · Dobbeltklik i havet">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
          <span>Fuldskærm</span>
        </button>
        <label class="shark-count" for="shark-count" title="Antal hammerhajer i havet">
          <span>Hajer <output id="shark-count-value" for="shark-count">21</output></span>
          <input id="shark-count" type="range" min="0" max="40" step="1" value="21" aria-label="Antal hammerhajer">
        </label>
      </nav>
    </footer>
    <p class="chrome hint">Venstre: skub · Højre: træk · Tag fat væk fra midten for at dreje</p>
    <div id="notice" role="status" aria-live="polite"></div>
  </main>
  <noscript>Slå JavaScript til i browseren for at se den animerede pauseskærm.</noscript>
  <script src="three.min.js"></script>
  <script src="ocean.js"></script>
</body>
</html>
